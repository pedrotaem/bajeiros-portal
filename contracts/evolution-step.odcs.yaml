apiVersion: v3.0.2
kind: DataContract
id: urn:bajeiros:contract:evolution-step
name: evolution_step
version: 1.0.0
status: draft
domain: engineering
dataProduct: bajeiros-portal
description:
  purpose: Fila de próximos passos da equipe (DF-13 E4) — derivada dos critérios pendentes.
  usage: 7 primeiros na tela Evolução, 3 no Início (DF-16). Passo de critério é derivado e
    idempotente (UNIQUE team_id+criterion_id); manual e meta são digitados.
schema:
  - name: evolution_step
    logicalType: object
    physicalType: table
    physicalName: evolution_steps
    properties:
      - name: id
        logicalType: string
        physicalType: uuid
        required: true
        primaryKey: true
      - name: team_id
        logicalType: string
        physicalType: uuid
        required: true
      - name: title
        logicalType: string
        required: true
        description: ≤ 140 caracteres.
      - name: area
        logicalType: string
        required: false
      - name: origin
        logicalType: string
        required: true
        description: criterion (derivado) | manual (membro) | meta (benchmark do DF-15)
      - name: criterion_id
        logicalType: string
        required: false
        description: Preenchido em origin=criterion; único por equipe (dedup da fila).
      - name: link_ref
        logicalType: string
        required: false
      - name: owner_user_id
        logicalType: string
        physicalType: uuid
        required: false
        classification: pii
        description: Dono do passo; anonimizado (SET NULL) na exclusão de conta.
        customProperties:
          - property: legalBasis
            value: contrato-art7-V
          - property: retention
            value: vida da equipe; anonimizado na exclusão da conta do titular
      - name: position
        logicalType: integer
        required: true
      - name: status
        logicalType: string
        required: true
        description: open | done | dismissed
      - name: created_by
        logicalType: string
        physicalType: uuid
        required: false
        classification: pii
        customProperties:
          - property: legalBasis
            value: contrato-art7-V
          - property: retention
            value: vida da equipe; anonimizado na exclusão da conta do titular
      - name: created_at
        logicalType: date
        physicalType: timestamptz
        required: true
      - name: done_by
        logicalType: string
        physicalType: uuid
        required: false
        classification: pii
        customProperties:
          - property: legalBasis
            value: contrato-art7-V
          - property: retention
            value: vida da equipe; anonimizado na exclusão da conta do titular
      - name: done_at
        logicalType: date
        physicalType: timestamptz
        required: false
customProperties:
  - property: dedup
    value: UNIQUE (team_id, criterion_id) — geração automática é idempotente (P-3.1)
  - property: visibility
    value: 7 na tela Evolução, 3 no Início; descarte é auditado
team:
  - username: pedrotaem@gmail.com
    role: owner
