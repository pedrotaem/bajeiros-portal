name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build único
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run build:lambda -w @bajeiros/api
      - name: Preparar artefatos da API # zip da Lambda + runner com as migrações
        run: |
          mkdir -p out/migrate/migrations
          (cd apps/api/dist/lambda && zip -q lambda.zip index.mjs)
          mv apps/api/dist/lambda/lambda.zip out/
          (cd apps/api/dist/idp-link && zip -q idp-link.zip index.mjs)
          mv apps/api/dist/idp-link/idp-link.zip out/
          cp apps/api/dist/lambda/migrate.bundle.mjs out/migrate/
          cp apps/api/migrations/*.sql out/migrate/migrations/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: apps/web/dist/
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lambda-${{ github.sha }}
          path: |
            out/lambda.zip
            out/idp-link.zip
          retention-days: 30 # rollback: republicar o zip de um SHA anterior (runbook)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migrate-${{ github.sha }}
          path: out/migrate/
          retention-days: 30

  deploy-staging:
    name: Deploy staging
    needs: build
    # Gate: setar a variable DEPLOY_ENABLED=true no repo após o apply do Terraform
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.bajeiros.com.br
    permissions:
      contents: read
      id-token: write # OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-${{ github.sha }}
          path: lambda
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: migrate-${{ github.sha }}
          path: migrate
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # sem checkout neste job — .nvmrc nao existe aqui
      - name: Migrar banco (Data API, ANTES de publicar o código novo)
        env:
          AWS_REGION: sa-east-1 # cluster fica em sa-east-1 (ADR-008)
          DB_CLUSTER_ARN: ${{ vars.DB_CLUSTER_ARN }}
          DB_MASTER_SECRET_ARN: ${{ vars.DB_MASTER_SECRET_ARN }}
          DB_APP_SECRET_ARN: ${{ vars.DB_APP_SECRET_ARN }}
        run: node migrate/migrate.bundle.mjs --dir migrate/migrations
      - name: Publicar Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://lambda/lambda.zip --publish --region sa-east-1
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" --region sa-east-1
          # DF-17: a trigger PreSignUp só existe onde o Google está ligado
          if [ -n "${{ vars.LAMBDA_IDP_LINK_FUNCTION_NAME }}" ]; then
            aws lambda update-function-code \
              --function-name "${{ vars.LAMBDA_IDP_LINK_FUNCTION_NAME }}" \
              --zip-file fileb://lambda/idp-link.zip --publish --region sa-east-1
            aws lambda wait function-updated \
              --function-name "${{ vars.LAMBDA_IDP_LINK_FUNCTION_NAME }}" --region sa-east-1
          fi
      - name: Gerar config.json do ambiente # build é único; config por env entra aqui
        run: |
          # DF-27: só o literal "true" liga a cortina "Em breve" (variable por
          # environment; staging não define). `if` e não `&&`: com `bash -e` um teste
          # falso no fim de linha derrubaria o passo.
          coming_soon=false
          if [ "${{ vars.COMING_SOON }}" = "true" ]; then coming_soon=true; fi
          printf '{"authMode":"cognito","comingSoon":%s,"cognito":{"domain":"%s","clientId":"%s","providers":%s}}' \
            "$coming_soon" "${{ vars.COGNITO_DOMAIN }}" "${{ vars.COGNITO_CLIENT_ID }}" \
            '${{ vars.COGNITO_PROVIDERS || '[]' }}' > dist/config.json
      - name: Sync S3 (assets primeiro, index e config por último)
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" \
            --exclude index.html --exclude config.json \
            --cache-control "public,max-age=31536000,immutable" --delete
          aws s3 cp dist/config.json "s3://${{ vars.SITE_BUCKET }}/config.json" \
            --cache-control "no-cache" --content-type "application/json"
          aws s3 cp dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - name: Invalidation mínima
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/" "/config.json"
      - name: Smoke test
        run: |
          sleep 15
          body=$(curl -fsS --retry 5 --retry-delay 10 "https://staging.bajeiros.com.br/")
          echo "$body" | grep -qi "bajeiros" || { echo "smoke FAIL: título não encontrado"; exit 1; }
          curl -fsS "https://staging.bajeiros.com.br/config.json" | grep -q clientId \
            || { echo "smoke FAIL: config.json sem clientId"; exit 1; }
          # retry generoso: 1ª chamada pode pegar cold start + resume do Aurora (~15-20s)
          curl -fsS --retry 8 --retry-delay 10 --retry-all-errors \
            "https://staging.bajeiros.com.br/api/v1/health" | grep -q '"ok":true' \
            || { echo "smoke FAIL: /api/v1/health sem ok:true"; exit 1; }

  deploy-production:
    name: Deploy produção (gated)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bajeiros.com.br
    permissions:
      contents: read
      id-token: write # OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }} # mesmo artefato do staging — sem rebuild
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lambda-${{ github.sha }}
          path: lambda
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: migrate-${{ github.sha }}
          path: migrate
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # sem checkout neste job — .nvmrc nao existe aqui
      - name: Migrar banco (Data API, ANTES de publicar o código novo)
        env:
          AWS_REGION: sa-east-1 # cluster fica em sa-east-1 (ADR-008)
          DB_CLUSTER_ARN: ${{ vars.DB_CLUSTER_ARN }}
          DB_MASTER_SECRET_ARN: ${{ vars.DB_MASTER_SECRET_ARN }}
          DB_APP_SECRET_ARN: ${{ vars.DB_APP_SECRET_ARN }}
        run: node migrate/migrate.bundle.mjs --dir migrate/migrations
      - name: Publicar Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://lambda/lambda.zip --publish --region sa-east-1
          aws lambda wait function-updated \
            --function-name "${{ vars.LAMBDA_FUNCTION_NAME }}" --region sa-east-1
          # DF-17: a trigger PreSignUp só existe onde o Google está ligado
          if [ -n "${{ vars.LAMBDA_IDP_LINK_FUNCTION_NAME }}" ]; then
            aws lambda update-function-code \
              --function-name "${{ vars.LAMBDA_IDP_LINK_FUNCTION_NAME }}" \
              --zip-file fileb://lambda/idp-link.zip --publish --region sa-east-1
            aws lambda wait function-updated \
              --function-name "${{ vars.LAMBDA_IDP_LINK_FUNCTION_NAME }}" --region sa-east-1
          fi
      - name: Gerar config.json do ambiente
        run: |
          # DF-27: só o literal "true" liga a cortina "Em breve" (variable por
          # environment; staging não define). `if` e não `&&`: com `bash -e` um teste
          # falso no fim de linha derrubaria o passo.
          coming_soon=false
          if [ "${{ vars.COMING_SOON }}" = "true" ]; then coming_soon=true; fi
          printf '{"authMode":"cognito","comingSoon":%s,"cognito":{"domain":"%s","clientId":"%s","providers":%s}}' \
            "$coming_soon" "${{ vars.COGNITO_DOMAIN }}" "${{ vars.COGNITO_CLIENT_ID }}" \
            '${{ vars.COGNITO_PROVIDERS || '[]' }}' > dist/config.json
      - name: Sync S3 (assets primeiro, index e config por último)
        run: |
          aws s3 sync dist/ "s3://${{ vars.SITE_BUCKET }}/" \
            --exclude index.html --exclude config.json \
            --cache-control "public,max-age=31536000,immutable" --delete
          aws s3 cp dist/config.json "s3://${{ vars.SITE_BUCKET }}/config.json" \
            --cache-control "no-cache" --content-type "application/json"
          aws s3 cp dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control "no-cache"
      - name: Invalidation mínima
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/" "/config.json"
      - name: Smoke test
        run: |
          sleep 15
          body=$(curl -fsS --retry 5 --retry-delay 10 "https://bajeiros.com.br/")
          echo "$body" | grep -qi "bajeiros" || { echo "smoke FAIL: título não encontrado"; exit 1; }
          curl -fsS "https://bajeiros.com.br/config.json" | grep -q clientId \
            || { echo "smoke FAIL: config.json sem clientId"; exit 1; }
          # retry generoso: 1ª chamada pode pegar cold start + resume do Aurora (~15-20s)
          curl -fsS --retry 8 --retry-delay 10 --retry-all-errors \
            "https://bajeiros.com.br/api/v1/health" | grep -q '"ok":true' \
            || { echo "smoke FAIL: /api/v1/health sem ok:true"; exit 1; }
